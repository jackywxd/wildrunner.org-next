name: E2E

# Pull requests only. This is the gate `main`'s branch protection enforces
# (required check: `playwright`), so by the time a commit reaches main it has
# already passed here.
#
# Deliberately no `push: main`: it re-ran this same suite, against the same
# tree, immediately after every merge — in parallel with deploy.yml, which
# runs it again against the *deployed* staging environment. Two runs that look
# like gates when only the PR one is, plus ~13 minutes per merge. The
# post-merge check that matters is deploy.yml's `verify-staging`, because it
# exercises a real deployment rather than a local dev server.
#
# ---
#
# Split into four jobs. It was one, and that one took 18 minutes with the
# Playwright run alone accounting for 17 of them — every test after the first
# waiting on every test before it, on a single runner.
#
# The suite runs with `workers: 1` and cannot simply be parallelised: every
# spec shares one local D1, and several assert over the whole corpus (`M1-T8`
# counts unowned rows; `e2e/corpus/` asserts about the data that is actually
# there). A second worker writing fixtures mid-assertion would make those
# read as failures. Sharding sidesteps that entirely — each shard is a
# separate runner with its own checkout, its own emulated D1 and its own dev
# server, so there is no shared state to race on.
#
# ---
#
# LANES BEFORE SHARDS. `--shard` divides by *test count*, and in this suite
# count is anti-correlated with cost. Measured on run 33276711769:
#
#   shard 1   12 corpus + 30 journeys + 32 unit   74 tests   6m19s
#   shard 2                            67 unit    67 tests     46s
#   shard 3                            65 unit    65 tests     38s
#
# Shard 1 held every browser test there was; the other two held pure functions
# and nothing else, and each still paid a container, an install, `payload
# migrate` and ~2m30s of seeding to execute about a third of a second of
# assertions. Balanced by count, wildly unbalanced by clock — because 164 of
# the 206 tests cost 2-20ms each while 30 journeys cost 3.2-15.9s each.
#
# So the unit level now runs in `checks` under its own config, with no server
# and no database (playwright.unit.config.ts explains why that needs a second
# config file rather than a second project): 164 tests in ~6s. What is left
# here is 42 tests that genuinely need a server, a database or a browser.
#
# Verified before landing by running those 42 both ways — unsharded, and as
# `--shard=1/3`, `2/3`, `3/3` (14 + 14 + 14). The sharded runs surface nothing
# the unsharded run does not, which is the property that matters: sharding
# regroups spec files, so a latent dependency between them would show up here.
# There is none.
#
# NOT BALANCED, and better said than implied. Measured on CI run 33290945244,
# the first fully green one: checks 50s, e2e 2m42s / 4m56s / 4m23s, build
# 2m49s, whole workflow 5m02s against the ~9m45s it replaced. The uploads and
# the AI journeys land together in shard 2, so the spread is about 1.8x here
# (2.9x locally) — the right shape rather than the finished one, and it caps
# what sharding can buy. If that starts to matter the next lever is sharding
# by duration from the previous run's JSON report instead of by count;
# `--shard` itself only ever divides by count.
#
# Where the 5m02s goes, on a cache hit: ~51s of container, checkout, install
# and restore, then 53.8s of `globalSetup` warming 20 routes, then the tests.
# Warming grew from 8 routes to 20 (e2e/helpers/warmup.ts) after `P-PHOTO`
# timed out on a route nobody had warmed — that cost is compile time moved
# out of test budgets, not removed.
#
# `playwright` at the bottom exists only to keep that name as the required
# check; branch protection cannot depend on a matrix job, whose runs are named
# `e2e (1)`, `e2e (2)`, `e2e (3)`.
on:
  pull_request:

jobs:
  # Cheap, and none of it needs a database — so it fails in ~2 minutes
  # instead of waiting behind a browser suite.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      # No `version:` here on purpose — action-setup errors out when a
      # version is given here *and* in package.json's `packageManager`.
      # package.json is the single source of truth (pnpm@10.12.4). Confirmed
      # against pnpm/action-setup@v6's own docs that this still holds for
      # pnpm 10.x — the "omit version only for pnpm v11+" note in its
      # migration guide is about the *different*, newer `pnpm/setup` action,
      # not this one.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Before Playwright, not after: the browser suite cannot catch a bad
      # node subclass or a wrong serialized shape.
      - name: Typecheck
        run: pnpm typecheck
      - name: Assert Cloudflare bindings
        run: pnpm assert:bindings
      - name: Assert Workers Builds LFS policy
        run: pnpm assert:lfs
      # The member editor imports @lexical/table directly (no proxy export
      # exists for it). A second copy would only surface as a runtime throw
      # the moment someone inserts a table, so check the version specs here.
      - name: Assert a single @lexical/table copy
        run: pnpm assert:lexical
      # The mechanical half of docs/testing-strategy.md. Here rather than in
      # the e2e job because it needs neither a database nor a browser, so a
      # test written the wrong way fails in 40 seconds instead of 7 minutes.
      - name: Assert the test strategy
        run: pnpm assert:tests
      # Pairs every `required` field with the control a member fills it in.
      # Here rather than in a browser spec because a requirement with no
      # control is visible in the source: the member would be asked for
      # something the interface never offers, and clicking would never find
      # it. Seconds, no database, no browser.
      - name: Assert every required field has a control
        run: pnpm assert:schema-screen
      # The unit lane. Here rather than in the `e2e` job because none of these
      # 164 tests touches a browser, a server or a database — they import a
      # function and call it — and until now all three shards were paying a
      # dev server and ~2m30s of seeding to run them anyway. Measured at 5.9s
      # with no server; the whole level costs less than the typecheck above.
      #
      # `assert:tests` (three steps up) is what keeps that true: it fails any
      # spec under e2e/unit/ that reaches for `page.`, `request.` or BASE_URL.
      - name: Unit lane
        run: pnpm test:unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Browsers and their OS-level deps (libasound2, libatk, …) come baked
    # into this image instead of being installed by a step below. Measured
    # directly on a real red run (shard 3, 2026-08-18): "Install Playwright
    # browsers" (`playwright install --with-deps chromium`) spent its whole
    # budget stuck inside the `apt-get` half of `--with-deps` — the log shows
    # a clean fetch of `noble-security`'s package index at 02:53:02, then
    # zero output of any kind until GitHub's own infra cancelled the job at
    # 03:02:16, ~9m15s later. The other two shards installed in 18s and 27s
    # the same run — this was a stalled connection to an Ubuntu apt mirror,
    # not a slow Playwright browser download, and re-running against a
    # different runner fixed it immediately. The container removes the class
    # of failure rather than papering over one instance of it: nothing in
    # this job touches `apt-get` or a browser download at all anymore.
    # Version pinned to match `@playwright/test` in package.json exactly
    # (1.56.1) — a mismatch between the npm package and the image's bundled
    # browser build is its own failure mode. Bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    strategy:
      # Every shard reports. One failing shard telling the other two to stop
      # would hide whichever failures they were about to find, and re-running
      # to discover them costs another full round.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Build the fixture database once per input set, not once per shard.
      #
      # Migrating and seeding cost 2m16s-2m51s and every shard paid it, on the
      # critical path, to produce a byte-identical database three times over.
      # Measured on a hit (run 33290945244): restore 1s, migrate/seed/save all
      # skipped, re-stamp 8s. Nine seconds for what was two and a half minutes.
      #
      # A cache and not a separate seed job: a job that seeds and uploads an
      # artifact serialises what is currently parallel, and measured against
      # these timings it makes the wall clock ~1m35s *worse*. A cache restores
      # inside each shard, concurrently, and falls back to seeding on a miss.
      #
      # THE KEY IS THE WHOLE SAFETY ARGUMENT. A key that misses an input
      # silently ships a stale corpus — precisely the failure `e2e/corpus/`
      # exists to catch, arriving in the one form it cannot see. So every
      # pattern below was traced to the script that reads it rather than
      # guessed: `.velite/**` is committed and is what migrate:velite reads;
      # seed-race-schedule imports src/lib/races/catalogue; import-race-
      # editions and import-race-qualifiers read data/*.csv; all five boot
      # Payload, so the config, the collections and the migrations are inputs
      # to every one of them. pnpm-lock.yaml is here because a Payload bump
      # can change what a migration produces.
      #
      # No `restore-keys`. A prefix fallback restores the newest *near* match,
      # which is a database built from different inputs — the exact thing this
      # key exists to prevent. An exact hit or a full seed, nothing between.
      #
      # RESTORE AND SAVE ARE SPLIT, AND THAT IS THE POINT. Plain `actions/cache`
      # saves in a post-job hook — which runs *after* Playwright, so what it
      # stored would be the database as the suite left it, test residue and
      # all. Every subsequent run would inherit the rows a failed teardown did
      # not remove, and `e2e/corpus/` asserts about the data that is actually
      # there. docs/testing-strategy.md is unambiguous that this is the thing
      # to avoid: "Setup and teardown are mandatory, not optional, and they run
      # every time", and the reason CI is named as doing it correctly is that
      # each job starts from an empty database. A cache saved after the tests
      # would quietly end that and make every run depend on the last one.
      #
      # So the save below happens immediately after seeding and before a single
      # test runs. What is cached is the corpus the seeds produce and nothing
      # else — the same bytes a fresh seed would produce, which is the only
      # thing that makes skipping the seed equivalent to running it.
      - name: Restore the seeded fixture database
        id: fixture
        uses: actions/cache/restore@v4
        with:
          # The whole directory, not the .sqlite: miniflare leaves a -wal that
          # routinely exceeds the database file itself (4.1MB against 1.7MB
          # when this was written), and restoring the three files apart from
          # one another would lose whatever had not been checkpointed.
          #
          # `d1` and not all of `state/v3`, because D1 is the entirety of what
          # the seeds produce. `migrate-velite-to-payload.ts` registers Media
          # rows pointing at objects already in R2 and deliberately does not
          # fetch or re-upload them (its own header says so), so local R2 holds
          # zero object blobs after a full seed — checked, not assumed. The
          # other state directories are miniflare bookkeeping the seeds never
          # write to.
          path: .wrangler/state/v3/d1
          key: >-
            d1-fixture-v1-${{ hashFiles(
              'src/migrations/**',
              'src/collections/**',
              'src/payload.config.ts',
              'src/lib/races/**',
              '.velite/**',
              'data/*.csv',
              'scripts/migrate-velite-to-payload.ts',
              'scripts/seed-race-schedule.ts',
              'scripts/seed-e2e-account.ts',
              'scripts/import-race-editions.ts',
              'scripts/import-race-qualifiers.ts',
              'pnpm-lock.yaml'
            ) }}
      - name: Apply local D1 migrations
        if: steps.fixture.outputs.cache-hit != 'true'
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CI: "true"
        run: |
          if [ -z "$PAYLOAD_SECRET" ]; then
            export PAYLOAD_SECRET="ci-payload-secret-change-me-32chars-min"
          fi
          pnpm payload migrate
      # A migrated database is an empty one, and the journeys are about a
      # visitor reading things. Without this, `V1` (article), `V2` (gallery)
      # and `V6` (rider) found nothing to click and *skipped*, while `V4/V5`
      # failed on an empty race calendar — four of six journeys reporting
      # something other than whether the site works, under a run that would
      # otherwise have gone green.
      #
      # Both scripts are the documented local-D1 seeds (AGENTS.md), and both
      # read from the repo: `migrate:velite` creates authors, posts and
      # galleries from the velite content, `seed:races` the race schedule.
      # So CI now exercises the same corpus a developer has locally, rather
      # than an empty shell that every data-dependent assertion steps around.
      - name: Seed the corpus the journeys read
        if: steps.fixture.outputs.cache-hit != 'true'
        # Bounded on purpose: these scripts boot Payload, and one that fails
        # to exit would otherwise burn the job's full 30 minutes before
        # anybody learned the seed was the problem.
        timeout-minutes: 8
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CI: "true"
          # Optional here — this database is created and destroyed inside
          # the job — but passed so the seeded account and the account the
          # suite signs in as cannot drift apart.
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          if [ -z "$PAYLOAD_SECRET" ]; then
            export PAYLOAD_SECRET="ci-payload-secret-change-me-32chars-min"
          fi
          pnpm migrate:velite
          pnpm seed:races
          # Last, because it owns whatever the two above created. Without it
          # `/riders` is empty: the directory selects authors with an owner,
          # and `setOwner` stamps that from the authenticated user, which a
          # CLI script does not have.
          pnpm seed:e2e:account
          # Last, and deliberately after seed:e2e:account now too: this
          # upserts data/race-editions.csv directly (import-race-editions.ts)
          # rather than deriving from race_schedule, but a race-record above
          # can auto-create a *minimal* edition as a side effect
          # (populateRaceRecordRefs) if its (event, year) has none yet.
          # Running the CSV import afterward upgrades any such stub whenever
          # the CSV covers that exact (event, year) — see
          # scripts/reset-local-db.mjs, which mirrors this same ordering.
          pnpm seed:editions
          # The qualifier flags live on race_categories, which the migrate
          # step above created — this only fills four columns per row. CI
          # needs it for the same reason it needs seed:editions: the
          # /races filters are about data the CSV carries, and a database
          # without it renders a filter that matches nothing.
          pnpm seed:qualifiers
      # Snapshot the corpus here — after seeding, before any test touches it.
      #
      # `cache-primary-key` is the key the restore step computed, so the two
      # cannot drift: there is one hashFiles expression in this file, not two
      # that have to be kept identical by hand.
      #
      # Only shard 1 writes it. All three seed identically on a miss, so three
      # uploads of the same bytes would race for one key and two would log a
      # reservation warning for no benefit. If shard 1 dies before this point
      # the run has bigger problems than a cold cache, and the next run simply
      # seeds again.
      - name: Save the seeded fixture database
        if: matrix.shard == 1 && steps.fixture.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .wrangler/state/v3/d1
          key: ${{ steps.fixture.outputs.cache-primary-key }}
      # The one thing a restored database cannot carry forward.
      #
      # Every other input to the fixture is a file, so the key above sees it
      # change. The e2e credential is a repo secret: rotating it — which
      # AGENTS.md requires, because the fallback in e2e/helpers/auth.ts is
      # published — touches no file at all, so a cached database would keep
      # the old hash and every sign-in would fail, reading as an auth bug
      # rather than a stale cache.
      #
      # So the account is re-stamped from the current secret whenever the
      # database came from the cache. `seed-e2e-account.ts` now updates an
      # existing user's password instead of returning it untouched, which is
      # what makes this converge rather than merely re-run. On a miss the step
      # above already ran it in its proper place in the ordering, so this is
      # skipped there rather than doing it twice.
      - name: Re-stamp the e2e account from the current secret
        if: steps.fixture.outputs.cache-hit == 'true'
        timeout-minutes: 5
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CI: "true"
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          if [ -z "$PAYLOAD_SECRET" ]; then
            export PAYLOAD_SECRET="ci-payload-secret-change-me-32chars-min"
          fi
          pnpm seed:e2e:account
      - name: Run Playwright (shard ${{ matrix.shard }}/3)
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CI: "true"
          # Optional here — this database is created and destroyed inside
          # the job — but passed so the seeded account and the account the
          # suite signs in as cannot drift apart.
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          NEXTJS_ENV: test
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          if [ -z "$PAYLOAD_SECRET" ]; then
            export PAYLOAD_SECRET="ci-payload-secret-change-me-32chars-min"
          fi
          # No `--` before the flag: `pnpm test:e2e -- --shard=1/3` exits 1
          # under pnpm 10, while passing it directly works. Checked both.
          pnpm test:e2e --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Runs alongside the shards rather than after them: it proves the app
  # compiles and bundles, which no test does, and it needs nothing the suite
  # produces.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply local D1 migrations
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          CI: "true"
        run: |
          if [ -z "$PAYLOAD_SECRET" ]; then
            export PAYLOAD_SECRET="ci-payload-secret-change-me-32chars-min"
          fi
          pnpm payload migrate
      - name: Migration dry-run counts
        run: pnpm migrate:velite:dry
      - name: OpenNext Cloudflare build
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_ENV: test
          # This runner has no Cloudflare credentials, so payload.config
          # falls back to local emulated D1 — which several parallel static
          # generation workers cannot share. See next.config.ts.
          NEXT_BUILD_CPUS: "1"
        run: |
          if [ -z "$PAYLOAD_SECRET" ]; then
            export PAYLOAD_SECRET="ci-payload-secret-change-me-32chars-min"
          fi
          pnpm exec opennextjs-cloudflare build

  # The name branch protection requires. Nothing runs here — it passes only
  # if every job above did. `if: always()` so a skipped or cancelled upstream
  # job is reported as a failure rather than quietly leaving this green.
  playwright:
    runs-on: ubuntu-latest
    needs: [checks, e2e, build]
    if: always()
    steps:
      - name: Report
        run: |
          echo "checks: ${{ needs.checks.result }}"
          echo "e2e:    ${{ needs.e2e.result }}"
          echo "build:  ${{ needs.build.result }}"
          if [ "${{ needs.checks.result }}" != "success" ] \
            || [ "${{ needs.e2e.result }}" != "success" ] \
            || [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::One or more E2E jobs did not succeed."
            exit 1
          fi
