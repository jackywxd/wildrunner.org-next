name: Race schedule maintenance

# Daily upkeep for the race schedule. See the long comment in
# src/endpoints/raceScheduleMaintenance.ts for what it does and — more
# importantly — what it does NOT do: registration status is derived per
# request, so the schedule is correct with or without this job. This clears
# stale manual overrides, busts the cache, and reports rows whose data has
# gone unverified.
#
# 16:05 UTC = 00:05 Taipei, just after the local day rolls over, so a race
# that opened for entry "today" is already showing as open when people wake
# up. Scheduled workflows can run late under GitHub load; nothing here is
# time-critical enough to care.
#
# Not a Cloudflare Cron Trigger: that needs a `scheduled` handler exported
# from the Worker, and OpenNext generates the Worker entrypoint. Wrapping it
# for one daily job is not a trade worth making — revisit if a second
# scheduled job appears.
on:
  schedule:
    - cron: "5 16 * * *"
  workflow_dispatch:

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run maintenance
        env:
          RACE_MAINTENANCE_SECRET: ${{ secrets.RACE_MAINTENANCE_SECRET }}
        run: |
          # Skip rather than fail when the secret is absent. This job is
          # opt-in: the schedule works without it, because registration
          # status is derived per request rather than written here. Failing
          # would mean a red run every single day until somebody sets a
          # secret they may not want — daily mail that teaches people to
          # ignore this workflow, which is worse than no signal at all.
          #
          # A warning still surfaces on the run and in the Actions list, so
          # "not set up yet" stays discoverable without being an incident.
          if [ -z "$RACE_MAINTENANCE_SECRET" ]; then
            echo "::warning::RACE_MAINTENANCE_SECRET is not set — skipping. Set it with 'wrangler secret put RACE_MAINTENANCE_SECRET' and add the same value to GitHub Secrets to enable the daily run."
            {
              echo '## Race schedule maintenance — skipped'
              echo
              echo '`RACE_MAINTENANCE_SECRET` is not configured, so the daily'
              echo 'upkeep did not run. The schedule itself is unaffected:'
              echo 'registration status is derived on every request.'
              echo
              echo 'To enable: `wrangler secret put RACE_MAINTENANCE_SECRET`,'
              echo 'then add the same value to this repo'"'"'s Actions secrets.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://wildrunner.org/api/races/maintenance' \
            -H "X-Maintenance-Secret: $RACE_MAINTENANCE_SECRET")

          echo "HTTP $code"
          cat "$body"

          if [ "$code" != "200" ]; then
            echo "::error::maintenance endpoint returned $code"
            exit 1
          fi

          # The report is the point of the run, so put it where a human will
          # see it without opening the log.
          {
            echo '## Race schedule maintenance'
            echo '```json'
            cat "$body"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
