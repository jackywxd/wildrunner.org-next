name: Deploy

# Trunk-based promotion. `main` is the only long-lived branch:
#
#   PR  -> e2e.yml gates on typecheck + the local suite + an OpenNext build
#   merge to main -> this workflow deploys STAGING, then re-runs the suite
#                    against the deployed origin
#   manual approval -> the SAME commit goes to PRODUCTION
#
# The gate deliberately sits before the merge (e2e.yml, `on: pull_request`)
# rather than after it, and there is no second integration branch: the tree
# verified on staging is byte-for-byte the tree promoted to production, which
# a `staging` -> `main` merge could not guarantee.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two promotions interleave — they share one staging environment
# and one production Worker. Queue instead of cancelling: a half-finished
# deploy is worse than a slow one.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  STAGING_URL: https://wildrunner-org-next-staging.small-tooth-cc10.workers.dev

jobs:
  staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `.env.staging` is gitignored (it holds PAYLOAD_SECRET and the Resend
      # key), and scripts/with-env.mjs requires the file to exist — it treats
      # that file as authoritative so a staging build can never inherit a
      # production or .env.local value. Stored as one secret containing the
      # whole file so CI and a laptop cannot drift key by key.
      - name: Materialise .env.staging
        env:
          STAGING_DOTENV: ${{ secrets.STAGING_DOTENV }}
        run: |
          if [ -z "$STAGING_DOTENV" ]; then
            echo "::error::secrets.STAGING_DOTENV is not set — see docs/workers-builds.md"
            exit 1
          fi
          printf '%s' "$STAGING_DOTENV" > .env.staging

      # Apply schema changes ONCE, before the build — never as a side effect
      # of it.
      #
      # `next build` fans static generation out across one worker per CPU,
      # and every worker boots Payload, which runs `prodMigrations` on init.
      # Staging's D1 bindings are `remote: true`, so each of those workers
      # opens the *real* staging database and races the others to apply the
      # same migration. The first `add_race_records` deploy failed exactly
      # this way: two workers logged "Migrating: ..." and the loser died on
      # CREATE TABLE.
      #
      # A losing worker does NOT necessarily leave the database untouched.
      # Staging happened to come out clean that time, and an earlier version
      # of this comment claimed a transaction was the reason — it is not.
      # The same migration later left production half-applied (table and two
      # indexes created; the remaining indexes, the rels column and the
      # ledger row missing), which had to be repaired by hand. D1 gives no
      # multi-statement rollback here, so losing this race can cost a manual
      # schema fix rather than just a re-run.
      #
      # It had never bitten before only because every earlier migration was
      # already applied to staging by the time a build ran, so the in-build
      # migrate found nothing pending and never raced.
      #
      # NODE_ENV=production is what makes payload.config request remote
      # bindings (see getCloudflareContextFromWrangler); without it this
      # would migrate the runner's throwaway local D1 and report success.
      # CLOUDFLARE_ENV picks staging's database rather than production's.
      # The deploy step below sets it too — see the note there for why it is
      # in this file and not in the STAGING_DOTENV secret.
      #
      # Production deliberately does NOT do this: its job asserts migrations
      # are already applied (`preflight:prod`) and fails if they are not,
      # because applying schema changes to production should be a decision,
      # not a deploy side effect.
      #
      # Retried because remote bindings mean this opens a *remote dev
      # session* against api.cloudflare.com before it can run any SQL, and
      # that handshake is a network call with a 10s connect timeout. The
      # first deploy after this step was added died on exactly that —
      # "Error while creating remote dev session: ConnectTimeoutError" —
      # and an unchanged re-run passed. A connect blip should not fail a
      # deploy. `payload migrate` is idempotent (it applies only what the
      # ledger says is pending), so re-running it is always safe.
      - name: Apply staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: staging
          NODE_ENV: production
        # `if`, not `[ … ] && sleep`: this block runs under `bash -e`, where
        # a bare test that evaluates false on the last attempt would exit the
        # script before the error below could be printed.
        run: |
          for attempt in 1 2 3; do
            if node scripts/with-env.mjs .env.staging pnpm payload migrate; then
              exit 0
            fi
            echo "::warning::migrate attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then
              # Long enough to outlast a Cloudflare API blip, short enough
              # that three attempts stay well inside the job timeout.
              sleep 20
            fi
          done
          echo "::error::staging migrations failed after 3 attempts"
          exit 1

      # CLOUDFLARE_ENV is set HERE, in the repo, not in the STAGING_DOTENV
      # secret — and that placement is the point.
      #
      # `--env staging` reaches wrangler but not the `next build` that
      # `opennextjs-cloudflare build` forks, and payload.config resolves its
      # D1 binding inside that child via
      # getPlatformProxy({ environment: process.env.CLOUDFLARE_ENV }).
      # Unset, it resolves the top-level binding — production — and because
      # the adapter applies `prodMigrations` on init when NODE_ENV=production,
      # a staging deploy then migrates the production database. That happened
      # twice.
      #
      # It belongs in the secret as well, and with-env would then override
      # this with the same value. But a secret's contents cannot be reviewed
      # or diffed, so the one setting that decides which database a build
      # writes to lives where it can be read.
      - name: Deploy to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: staging
        run: pnpm deploy:staging

  verify-staging:
    name: E2E against staging
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # PLAYWRIGHT_BASE_URL must match the deployed NEXT_PUBLIC_SITE_URL
      # exactly: Payload derives its CSRF allowlist from `serverURL`, so a
      # mismatched origin makes every authenticated test fail with nothing
      # useful in the output. Pointing at a non-localhost origin also turns
      # off the local dev server and widens the per-test timeout — see
      # playwright.config.ts.
      # E2E_ADMIN_* are required here, not optional. The fallback in
      # e2e/helpers/auth.ts is published — this repository is public — and
      # staging answers `/`, `/admin` and `/members/login` with 200 to anyone.
      # So every deploy signed in to a publicly reachable site with a
      # credential anybody could read, and the job succeeding was the proof
      # that it worked. The helper now refuses that combination outright, so a
      # missing secret fails this job loudly instead of quietly working.
      #
      # Setting the secret is half of it: the account's password on the
      # deployed environment has to be rotated too, or the published one keeps
      # opening the door whether or not this suite uses it.
      - name: Run Playwright against staging
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.STAGING_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          CI: "true"
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-staging
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # The suite creates posts, galleries, media and accounts on the shared
      # staging database. Always clean up, including after a failure, or the
      # residue accumulates in the database production cuts over to.
      - name: Clean up staging test data
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DOTENV: ${{ secrets.STAGING_DOTENV }}
        run: |
          printf '%s' "$STAGING_DOTENV" > .env.staging
          # Through with-env, not bare: `pnpm cleanup:staging` only loads
          # .env.local, which exists on a laptop and never in CI — so Payload
          # started without PAYLOAD_SECRET and died with "missing secret key".
          node scripts/with-env.mjs .env.staging pnpm cleanup:staging

  production:
    name: Deploy production
    needs: verify-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # THE GATE. Configure `production` as a GitHub Environment with required
    # reviewers: this job then waits for an explicit human approval before it
    # runs, and records who granted it. That approval — on a commit already
    # proven against staging — is the release request.
    environment:
      name: production
      url: https://wildrunner.org
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Materialise .env.production
        env:
          PRODUCTION_DOTENV: ${{ secrets.PRODUCTION_DOTENV }}
        run: |
          if [ -z "$PRODUCTION_DOTENV" ]; then
            echo "::error::secrets.PRODUCTION_DOTENV is not set — see docs/workers-builds.md"
            exit 1
          fi
          printf '%s' "$PRODUCTION_DOTENV" > .env.production

      # Schema changes must already be applied: the migrate step inside a
      # Workers Builds container writes to a throwaway local D1, so this
      # checks for pending migrations instead of assuming.
      - name: Preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm preflight:prod

      # No CLOUDFLARE_ENV here, and the asymmetry with the staging job is the
      # point. `wrangler.jsonc` has exactly one `env` section — `staging` —
      # and production is the top-level config, which is wrangler's normal
      # shape. Setting CLOUDFLARE_ENV=production makes OpenNext pass
      # `--env=production`, and wrangler rejects it outright:
      #
      #   Before using `--env=production` there should be an equivalent
      #   environment section in the configuration.
      #   The available configured environment names are: ["staging"]
      #
      # It was added for symmetry, under a comment asserting it "changes
      # nothing today". It changed everything: run 31019383368 sat through
      # the approval gate and then failed on this step, so #26 never reached
      # production at all. Staging needs the variable because staging is not
      # the default; production must not have it because production is.
      #
      # Retried on one specific signature, same reasoning as "Apply staging
      # migrations" above: static generation boots Payload, which opens a
      # remote D1 binding to check whether `payload_migrations` exists
      # before it can render any page — a real network call, this time to
      # `cloudflare-internal:d1-api` rather than the dev-session handshake,
      # but the same class of edge blip. Run 31157343022 got back a body
      # its own D1 client couldn't parse as JSON at all
      # ("D1_ERROR: Failed to parse body as JSON, got: error code: 1031"),
      # which is what an edge-side hiccup looks like — a genuine D1 error
      # (bad SQL, missing table) comes back as valid JSON with an error
      # field, and would fail identically on every attempt. So only that
      # exact "failed to parse body as JSON" text triggers a retry; anything
      # else — a TypeScript error, a real migration problem, wrangler
      # rejecting a bad flag — exits on the first attempt instead of
      # burning two more build cycles to reach the same failure.
      #
      # `pnpm deploy:prod` reruns the build from scratch each time, but
      # nothing before it is stateful (nothing has been deployed yet), and
      # the failure happens ~5s into "Collecting page data" — under a
      # minute into the build — so a blind rerun of the whole command is
      # cheap enough that isolating just the build step is not worth the
      # extra moving parts.
      #
      # `set -o pipefail` is not decoration. `if pnpm deploy:prod | tee log`
      # tests the *pipeline's* status, which without it is `tee`'s, which is
      # always 0 — so the `if` branch was taken on attempt 1 no matter what
      # the build did. Verified in a shell, not reasoned about: a loop of
      # this exact shape over `false | tee` reports "the if branch was taken"
      # and exits 0.
      #
      # Two consequences, both live until now. The retry loop below was dead
      # code: attempt 2 was unreachable. And a *failed build* was reported as
      # a successful deploy — run 33212001515 went red only because the smoke
      # check afterwards happened to notice, and would have been green if the
      # site had answered 200 while nothing had been deployed.
      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # One worker for "Collecting page data", the same value
          # .github/workflows/e2e.yml sets and next.config.ts's `cpus`
          # comment prescribes.
          #
          # Run 33212001515 built with three and D1 answered "Your account is
          # generating too much load on D1 DBs. Please back off and try again
          # later." That limit is account-wide, so three workers each booting
          # Payload against remote production D1 is the load, and this job
          # starts moments after `verify-staging` has spent five minutes
          # working the same account's staging database.
          NEXT_BUILD_CPUS: "1"
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if pnpm deploy:prod 2>&1 | tee deploy-prod.log; then
              exit 0
            fi
            # Two signatures retry, both of them the edge saying "not now"
            # rather than "not ever": the unparseable body documented above,
            # and D1's own back-off, whose message asks for exactly this.
            # Anything else — a TypeScript error, a real migration problem,
            # wrangler rejecting a bad flag — still exits on the first
            # attempt rather than burning two more build cycles.
            if [ "$attempt" -lt 3 ] && grep -qE 'D1_ERROR: Failed to parse body as JSON|too much load on D1' deploy-prod.log; then
              echo "::warning::deploy:prod attempt $attempt hit a transient D1 condition, retrying"
              sleep 60
              continue
            fi
            echo "::error::deploy:prod failed on attempt $attempt"
            exit 1
          done

      - name: Smoke-check production
        run: |
          for path in / /posts /gallery /about /races; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://wildrunner.org$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done

  # Its own job, deliberately, and not a step inside `staging`.
  #
  # As a step it was the LAST thing before `Deploy to staging`, so when it
  # failed the site never deployed either — and `verify-staging` and the whole
  # production chain were skipped behind it. That is exactly what happened on
  # its first two runs: `wrangler` builds the image fine, then calls
  # GET /accounts/<id>/containers/me for registry credentials and gets 403
  # `Authentication error`, because the CI token has no Containers permission.
  # Deploying by hand never hit it — a local OAuth login has it. Two merges
  # (#73, #74) sat undeployed on `main` for that reason alone.
  #
  # A separate Worker's deploy must not be able to hold the site hostage. Red
  # here is loud and specific; it just no longer stops anything else.
  #
  # These no longer run before the site. The ordering only ever mattered for
  # the very first deploy, when the site's TRANSCODER binding had nothing to
  # point at — and if that were ever true again, the site's own deploy would
  # fail on the missing script and say so.
  transcoder-staging:
    name: Deploy transcoder (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # No package.json under workers/transcoder — `npx wrangler` resolves
      # the pinned wrangler from the repo root's node_modules, so the install
      # is not optional even though nothing here imports the site's code.
      - run: pnpm install --frozen-lockfile

      # The transcoder is a SEPARATE Worker (workers/transcoder), and until
      # this step existed nothing deployed it. That is not a hypothetical
      # gap: production ran the transcoder's FIRST version for a full day
      # after every fix had merged, because `main` moving deploys the site
      # and nothing else. It was still carrying the unauthenticated
      # `/transcode` handler that accepted a caller-supplied destination
      # key — anyone who knew the hostname could overwrite any object in the
      # production media bucket — plus the unawaited RPC that silently
      # dropped every job. A member's upload sat in `queued` and nobody
      # would have noticed until they asked.
      #
      # Container rollouts are not a routine cost of this step. wrangler
      # only touches the container application when the image digest
      # changes, and reports "No changes to be made" otherwise — so a deploy
      # that alters only the site, or only the Worker script, leaves running
      # containers alone. A change to the Dockerfile or transcode.sh does
      # roll them, which SIGKILLs anything mid-encode; the lease sweep
      # re-queues those, which is what it is for.
      - name: Deploy transcoder to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/transcoder
        run: npx wrangler deploy --env staging

  # Gated exactly as the site's production deploy is: staging deployed,
  # then E2E green against it. Plus its own staging deploy, so production
  # never gets an image staging refused.
  transcoder-production:
    name: Deploy transcoder (production)
    needs: [transcoder-staging, verify-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # No package.json under workers/transcoder — `npx wrangler` resolves
      # the pinned wrangler from the repo root's node_modules, so the install
      # is not optional even though nothing here imports the site's code.
      - run: pnpm install --frozen-lockfile

      # Same reasoning as the staging step above — see the long note there.
      # Production is the top-level wrangler config, so no `--env` flag:
      # `wrangler.jsonc` has exactly one `env` section (`staging`), and
      # naming production explicitly is rejected outright.
      - name: Deploy transcoder to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/transcoder
        run: npx wrangler deploy
